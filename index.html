<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRF2 — Inventário + PCTT + OCR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>TRF2 — Inventário de Caixas</h1>
  <p>OCR + PCTT 2026 + preenchimento da planilha</p>
</header>

<main>
<section class="card">
  <h2>1. Documento</h2>
  <div class="row">
    <label class="filebox">
      <span>📷 Fotografar / escolher imagem</span>
      <input id="imageInput" type="file" accept="image/*" capture="environment">
    </label>
    <label class="filebox">
      <span>📄 Escolher PDF</span>
      <input id="pdfInput" type="file" accept="application/pdf">
    </label>
  </div>
  <div id="preview"></div>
  <button id="ocrBtn" disabled>🔎 Ler documento com OCR</button>
  <div class="progress"><div id="bar"></div></div>
  <div id="status"></div>
</section>

<section class="card">
  <h2>2. Resultado do OCR</h2>
  <textarea id="ocrText" rows="10" placeholder="O texto reconhecido aparecerá aqui. Você pode corrigir antes de classificar."></textarea>
  <button id="classifyBtn">🧠 Classificar pelo PCTT</button>
</section>

<section class="card">
  <h2>3. Classificação PCTT</h2>
  <div id="matches"></div>
  <div id="pcttDetails" class="details"></div>
</section>

<section class="card">
  <h2>4. Dados da caixa</h2>
  <div id="form"></div>
  <button id="addBtn">➕ Adicionar registro</button>
  <button id="exportBtn">📊 Exportar Excel</button>
</section>

<section class="card">
  <h2>5. Registros</h2>
  <div id="records"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
